# Security headers, repeated in every location that sets its own add_header (nginx drops the
# inherited ones there). The dashboard loads only its own script and stylesheet and opens
# one same-origin EventSource, so everything is 'self'; a test in tests/test_deploy.py checks
# the page against this policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
