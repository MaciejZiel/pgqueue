# Goes in the http {} block (e.g. include it from nginx.conf). Limits what one visitor can cost.
#
# Behind a tunnel every request reaches nginx from 127.0.0.1, so limits keyed on the
# remote address would be shared by all visitors. Cloudflare Tunnel passes the visitor's
# address in CF-Connecting-IP; use it when present. (With another tunnel, put the header
# it sets here, and make sure nginx is reachable only through the tunnel, or the header
# can be forged.)
map $http_cf_connecting_ip $pgqueue_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_conn_zone $pgqueue_client zone=pgqueue_conn:1m;
limit_req_zone  $pgqueue_client zone=pgqueue_req:1m rate=10r/s;
# One key for everybody: caps the live streams in total, below the app's own limit (200).
map $request_method $pgqueue_everyone {
    default all;
}
limit_conn_zone $pgqueue_everyone zone=pgqueue_streams:64k;
