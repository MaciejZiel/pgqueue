# Goes inside the server {} block. The dashboard is then at https://<host>/pgqueue/
# (DEMO_ROOT_PATH=/pgqueue in the env file; the port must match DEMO_PORT).

location = /pgqueue { return 301 /pgqueue/; }

# Static assets straight from disk: adjust the path to your checkout.
location /pgqueue/static/ {
    alias /data/data/com.termux/files/home/pgqueue/src/pgqueue/admin/static/;
    expires 1h;
    add_header Cache-Control "public";
}

# Browsers ask for /favicon.ico (and iOS for the touch icon) at the host root, without reading the page.
location = /favicon.ico {
    alias /data/data/com.termux/files/home/pgqueue/src/pgqueue/admin/static/favicon.ico;
    expires 1d;
}
location = /apple-touch-icon.png {
    alias /data/data/com.termux/files/home/pgqueue/src/pgqueue/admin/static/apple-touch-icon.png;
    expires 1d;
}

# The live event stream: long-lived, unbuffered, capped per visitor and in total.
# Refused viewers get a 503 and the dashboard falls back to polling.
location = /pgqueue/api/stream {
    limit_conn pgqueue_conn 4;
    limit_conn pgqueue_streams 150;
    limit_conn_status 503;
    proxy_pass http://127.0.0.1:8765/api/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

location /pgqueue/ {
    limit_req zone=pgqueue_req burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
