[project]
name = "pgqueue"
version = "0.1.0"
description = "A production-style background job queue built on PostgreSQL: SKIP LOCKED claiming, retries with backoff, leases, LISTEN/NOTIFY and cron."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Zieliński" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "asyncpg>=0.31,<0.32",
    "sqlalchemy[asyncio]>=2.1.1,<2.2",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
admin = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<4",
    "prometheus-client>=0.26,<0.27",
]

[project.scripts]
pgqueue = "pgqueue.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.9,<0.17",
    "mypy>=2.3.1,<2.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgqueue"]

[tool.uv]
# Company policy: only depend on releases that are at least two weeks old.
exclude-newer = "2026-09-26T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "PT", "TID", "C4"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
# Benchmarks poll the database on purpose: that is what they measure.
"bench/**" = ["ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples", "bench"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["stress: long-running concurrency stress tests"]
